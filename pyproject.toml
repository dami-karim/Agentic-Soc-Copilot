[project]
name = "agentic-soc-copilot"
version = "0.1.0"
description = "Agentic SOC Co-Pilot for autonomous alert triage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.20",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",   # <--- Replaces vllm. Connects to Ollama.
    "opensearch-py>=2.4.0",
    "neo4j>=5.20.0",
    "qdrant-client>=1.11.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.38.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "transformers>=4.44.0",      # Still useful for sentence-transformers (embeddings)
    "sentence-transformers>=3.1.0",  # Embeddings for Qdrant vector search
    "torch>=2.3.0",              # Still needed for embedding models, but will run on CPU
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"